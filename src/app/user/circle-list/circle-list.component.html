<app-header></app-header>
<a href="javascript:void(0);" (click)="backClicked()" class="back_navigator">
  <img src="assets/images/back-btn.png" alt="back button" title="Back to prevoius view">
</a>
<section class="top-space container">
  @if (isLoading) {
    <div class="row">
      <mat-spinner class="mx-auto"></mat-spinner>
    </div>
  }
  @if (lists.length > 0 && !isLoading) {
    <div class="row savings-box">
      <div class="col-md-12">
        <div class="section-title mb-5">
          <h2 class=" mb-3 section-title border-0 ct_after_line_none">My Circle Members</h2>
          <p class=" mb-4 ct_fw_600 text-center ct_fs_20" style="color: #F2994A ;">{{(circleName)}}</p>
        </div>
        <div class="search-results">
          <div class="row">
            @for (data of lists; track data; let i = $index) {
              <div class="col-lg-12 px-lg-3 px-0 ">
                <div class="old-heights show-accordion">
                  <div
                    class="box-line-white second-line-none border-0 rounded-0 py-4 mt-0 mb-2 border-left-5">
                    <!-- {{i+1}} -->
                    <div class="d-flex justify-content-between align-items-center">
                      <div class=" right-box text-left d-flex align-items-center">
                        <div data-toggle="modal" data-target="#img22">
                          <a class="nav-link profile-click have-notification mt-0"
                            href="javascript:void(0)">
                            <div (click)="showImg(data.profile_image)">
                              <img [src]="data?.profile_image ? data?.profile_image : 'assets/img/np_pro.png'"
                                class="img-fluid">
                            </div>
                          </a>
                        </div>
                        <div class="ml-3 w-100">
                          <div class="d-flex align-items-center">
                            <p class="sub-para text-left mr-3">
                              {{data.first_name}} {{data.last_name}}
                            </p>
                          </div>
                        </div>
                      </div>
                      @if (data.role !== 'Member') {
                        <div class="">
                          <span class="mb-0 ct_subrole_badge text-white"
                            style="background-color: #092c4b;">
                            <a [href]="'mailto:' + data.email">
                              {{ data.role }}
                            </a>
                          </span>
                        </div>
                      }
                    </div>
                  </div>
                </div>
              </div>
            }
          </div>
        </div>
        @if (notEmptyPost) {
          <div id="loadmoreuserqsn" class="text-center mt-4">
            <div class="row pb-5">
              <div class="col-md-12 p-5">
                <ngx-spinner bdOpacity=0.9 bdColor="" size="default" color="#581f87" type="ball-pulse-sync"
                  [fullScreen]="false">
                </ngx-spinner>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  }
</section>
<app-sub-menu></app-sub-menu>
<app-mobile-menu></app-mobile-menu>
<app-footer></app-footer>

<a routerLink="/user/all-services" class="business-directory-fab" aria-label="Member Directory">
  <span class="business-directory-fab__icon">
    <i class="fa fa-briefcase" aria-hidden="true"></i>
  </span>
  <span class="business-directory-fab__text">Member Directory</span>
</a>

<!-- Img -->
<div class="modal fade" id="img22">
  <div class="modal-dialog">
    <div class="modal-content">
      <img [src]="userImg1 ? userImg1 : 'assets/img/np_pro.png'" alt="img">
    </div>
  </div>
</div>
