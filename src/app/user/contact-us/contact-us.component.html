<section class="top-space profile-form-section contact-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <form class="profile-card" [formGroup]="form" (submit)="onSave()">
          <div class="row">
            <div class="col-lg-12">
              <h2 class="section-title">Contact Us</h2>
              <!-- <p class="para-md mb-3">Lorem ipsum dolor sit amet, consectetur adipiscing elit Pellentesque dapibus interdum auctor. Donec gravida dolor at mollis fringilla elit quota lesmon.</p> -->
            </div>
            <div class="col-lg-12 col-md-12 col-sm-12">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" formControlName="name" value="John" class="form-control"
                  placeholder="Enter first name">
                <div class="icon">
                  <img src="assets/images/user.png" align="" alt="" title="">
                </div>
                <span class="error-form" *ngIf="form.get('name').invalid && form.get('name').touched">
                  Please enter a name.
                </span>
              </div>
            </div>
            <div class="col-lg-12 col-md-12 col-sm-12">
              <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" formControlName="email" value="john97@gmail.com" class="form-control"
                  placeholder="Enter your email">
                <div class="icon">
                  <img src="assets/images/mail.png" align="" alt="" title="">
                </div>
                <span class="error-form" *ngIf="form.get('email').invalid && form.get('email').touched">
                  Please enter a email.
                </span>
              </div>
            </div>
            <div class="col-lg-12 col-md-12 col-sm-12">
              <div class="form-group">
                <label class="form-label">Mobile Number</label>
                <input type="number" formControlName="mobile_number" placeholder="Enter your mobile number"
                  class="form-control">
                <div class="icon">
                  <img src="assets/images/call-sm.png" align="" alt="" title="">
                </div>
                <span class="error-form" *ngIf="form.get('mobile_number').invalid && form.get('mobile_number').touched">
                  Please enter a mobile number.
                </span>
              </div>
            </div>

            <div class="col-lg-12 col-md-12 col-sm-12">
              <div class="form-group">
                <label class="form-label">Help Type</label>
                <select class="form-control" formControlName="type">
                  <option value=''>Select Type</option>
                  <option value="Emergency loan">Emergency loan</option>
                  <option value="Savings">Savings</option>
                  <option value="SavingsJNR">Savings JNR</option>
                  <option value="Loan">Loan</option>
                  <option value="Provident">Provident</option>
                  <option value="General">General</option>
                  <option value="Welfare">Welfare</option>
                  <option value="Safekeeping">Safekeeping</option>
                  <option value="Miscellaneous">Miscellaneous</option>
                  <option value="Investment">Investment</option>
                  <option value="helptobuy">Help to Buy</option>
                </select>
                <div class="icon hide-caret"></div>
                <div class="icon">
                  <img src="assets/images/caret.png" align="" alt="" title="">
                </div>
                <span class="error-form" *ngIf="form.get('type').invalid && form.get('type').touched">
                  Please enter a type.
                </span>
              </div>
            </div>

            <div class="col-lg-12 col-md-12 col-sm-12">
              <div class="form-group">
                <label class="form-label">Message</label>
                <textarea formControlName="message" placeholder="Enter your message" class="form-control"></textarea>
                <div class="icon">
                  <img src="assets/images/mail.png" align="" alt="" title="">
                </div>
                <span class="error-form" *ngIf="form.get('message').invalid && form.get('message').touched">
                  Please enter a message.
                </span>
              </div>
            </div>
            <div class="col-sm-12 text-center">
              <button class="btn-cstm btn-orange mt-4 min-width-230" type="submit" [disabled]="isLoading">
                <span *ngIf="!isLoading">Submit</span>
                <span *ngIf="isLoading"> <i class="fa fa-refresh fa-spin"></i></span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
<app-sub-menu></app-sub-menu>
<app-mobile-menu></app-mobile-menu>
<app-footer></app-footer>

<a routerLink="/user/all-services" class="business-directory-fab" aria-label="Member Directory">
  <span class="business-directory-fab__icon">
    <i class="fa fa-briefcase" aria-hidden="true"></i>
  </span>
  <span class="business-directory-fab__text">Member Directory</span>
</a>
